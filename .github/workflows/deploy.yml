name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Rebuild every day at 06:00 UTC — new dated posts appear automatically
    - cron: '0 6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium (dla generate-blog-pdfs.mjs)
        run: npx playwright install --with-deps chromium

      - name: Validate CPR content (daty vs Working Plan COM(2025) 772)
        run: npm run validate-cpr

      - name: Build
        run: npm run build
        env:
          VITE_WEB3FORMS_ACCESS_KEY: ${{ secrets.VITE_WEB3FORMS_ACCESS_KEY }}
          VITE_MAILERLITE_API_KEY: ${{ secrets.VITE_MAILERLITE_API_KEY }}

      - name: Copy index.html to 404.html (SPA routing fix)
        run: cp dist/index.html dist/404.html

      - name: Prepare Pages artifact
        run: |
          touch dist/.nojekyll
          echo "www.nowycpr.pl" > dist/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
