name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Rebuild every day at 06:00 UTC — new dated posts appear automatically
    - cron: '0 6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.60.0-noble
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify bundled Chromium for PDF generation
        timeout-minutes: 2
        run: node --input-type=module -e 'import { chromium } from "playwright"; const browser = await chromium.launch(); console.log(await browser.version()); await browser.close();'

      - name: Validate CPR content (daty vs Working Plan COM(2025) 772)
        run: npm run validate-cpr

      - name: Verify publication dates and named author rules
        run: node --test scripts/blog-publication.test.mjs scripts/blog-authors.test.mjs

      - name: Build
        run: npm run build
        env:
          VITE_WEB3FORMS_ACCESS_KEY: ${{ secrets.VITE_WEB3FORMS_ACCESS_KEY }}
          VITE_MAILERLITE_API_KEY: ${{ secrets.VITE_MAILERLITE_API_KEY }}

      - name: Verify scheduled articles are absent from public output
        run: node scripts/verify-blog-publication.mjs

      - name: Copy index.html to 404.html (SPA routing fix)
        run: cp dist/index.html dist/404.html

      - name: Prepare Pages artifact
        run: |
          touch dist/.nojekyll
          echo "www.nowycpr.pl" > dist/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
