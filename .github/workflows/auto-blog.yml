name: Auto Blog Post (weekly)

on:
  schedule:
    # Każdy poniedziałek o 07:00 UTC = 08:00 CET / 09:00 CEST
    - cron: '0 7 * * 1'
  workflow_dispatch:  # Możliwość ręcznego uruchomienia z GitHub UI

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Generate blog post via Gemini
        run: node scripts/auto-blog.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}

      - name: Create Pull Request with review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add content/blog/ public/images/blog/
          if [ -d content/drafts ]; then
            git add content/drafts/
          fi

          if git diff --staged --quiet; then
            echo "ℹ️ Brak nowych postów do dodania"
            exit 0
          fi

          # Nazwa brancha z datą
          BRANCH="auto-blog/$(date +%Y-%m-%d)-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          git commit -m "🤖 Auto blog: $(date +%Y-%m-%d)"
          git push -u origin "$BRANCH"

          # Pobierz wynik recenzji (wygenerowany przez auto-blog.mjs)
          REVIEW=""
          if [ -f .review-result.md ]; then
            REVIEW=$(cat .review-result.md)
          else
            REVIEW="⚠️ Brak automatycznej recenzji."
          fi

          # Stwórz PR z recenzją w opisie
          gh pr create \
            --title "🤖 Przegląd treści CPR: $(date +%Y-%m-%d)" \
            --body "$(cat <<EOF
          ## Automatycznie wygenerowany artykuł

          Ten materiał został wygenerowany automatycznie i wymaga **ręcznej weryfikacji** przed merge.

          Jeżeli plik trafił do \`content/drafts/\`, nie jest publikowany na portalu. Po akceptacji trzeba go ręcznie przenieść do \`content/blog/\`.

          ### 🔍 Recenzja automatyczna (Gemini)

          ${REVIEW}

          ### ✅ Checklist przed merge

          - [ ] Tytuł i excerpt nie wprowadzają w błąd
          - [ ] Daty i status norm są aktualne
          - [ ] Nie twierdzi że GWP/DPP już obowiązuje (brak hTS!)
          - [ ] Numery artykułów CPR prawidłowe
          - [ ] Zdjęcie wygenerowane i adekwatne, jeśli materiał jest gotowy do publikacji

          ---
          🤖 Wygenerowano automatycznie przez [auto-blog.mjs]
          EOF
          )" \
            --label "auto-blog" \
            --base main \
            --head "$BRANCH"

          echo "✅ Pull Request utworzony — czeka na Twoją akceptację"
