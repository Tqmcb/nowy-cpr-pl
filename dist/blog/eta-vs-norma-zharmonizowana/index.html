        {
          "@type": "Question",
          "name": "Co to jest CPR 2024/3110?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "CPR 2024/3110 to Rozporządzenie Parlamentu Europejskiego i Rady (UE) 2024/3110 z dnia 27 listopada 2024 r. w sprawie wyrobów budowlanych, które uchyla dotychczasowe Rozporządzenie (UE) Nr 305/2011 (CPR). Reguluje warunki wprowadzania wyrobów budowlanych do obrotu na rynku UE — określa wymagania dotyczące deklarowania właściwości użytkowych, oznakowania CE, certyfikacji i cyfryzacji dokumentacji. Stosuje się od 8 stycznia 2026 roku."
          }
        },
        {
          "@type": "Question",
          "name": "Od kiedy obowiązuje CPR 2024/3110?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Rozporządzenie CPR 2024/3110 weszło w życie 8 stycznia 2025 r. (20 dni po publikacji w Dzienniku Urzędowym UE), natomiast jego przepisy są stosowane od 8 stycznia 2026 roku. Od tej daty producenci wyrobów budowlanych objętych normami zharmonizowanymi są zobowiązani do wystawiania deklaracji DoP&C (nie DoP jak w CPR 305/2011), stosowania oznakownia CE wg nowych zasad i udostępniania cyfrowej DoP&C."
          }
        },
        {
          "@type": "Question",
          "name": "Czym różni się CPR 2024/3110 od starego CPR 305/2011?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Główne zmiany CPR 2024/3110 względem CPR 305/2011: (1) Deklaracja DoP zastąpiona przez DoP&C (Deklaracja Właściwości Użytkowych i Zgodności) — obowiązkowa forma cyfrowa; (2) Systemy AVCP zastąpione przez systemy AVS — dodano nowy system 3+ dla EPD; (3) Obowiązkowe ujawnianie substancji SVHC >0,1% w/w w wyrobie (art. 15 ust. 6); (4) Nowe wymagania dotyczące Cyfrowego Paszportu Produktu (DPP, art. 75-80); (5) Uproszczenia dla mikroprzedsiębiorstw i MŚP; (6) Kod QR z unikalnym identyfikatorem na wyrobie lub opakowaniu (art. 22 ust. 5)."
          }
        },
        {
          "@type": "Question",
          "name": "Co to jest DoP&C i czym różni się od DoP?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "DoP&C (Deklaracja Właściwości Użytkowych i Zgodności) to nowy dokument wprowadzony przez CPR 2024/3110 (art. 15), zastępujący dawną DoP (Deklarację Właściwości Użytkowych) z CPR 305/2011. Różnice: DoP&C musi być dostępna w formie cyfrowej (link lub kod QR), zawiera nową sekcję o substancjach SVHC, deklaruje jednocześnie właściwości użytkowe i zgodność z rozporządzeniem. Wzór DoP&C określa Załącznik V do CPR 2024/3110."
          }
        },
        {
          "@type": "Question",
          "name": "Jakie są systemy AVS w CPR 2024/3110?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "CPR 2024/3110 wprowadza 6 Systemów Oceny i Weryfikacji Stałości Właściwości Użytkowych (AVS), określonych w Załączniku IX: System 1+ (najwyższy — certyfikat JN dla wyrobu + certyfikat FPC + nadzór); System 1 (certyfikat JN dla wyrobu + certyfikat FPC); System 2+ (certyfikacja FPC przez JN + badania własne producenta); System 3 (badania typu przez NTL, FPC przez producenta); System 3+ (NOWY — weryfikacja EPD przez NTL, bez odpowiednika w AVCP); System 4 (badania własne producenta, tylko FPC wewnętrzna). System AVS dla danego wyrobu określony jest w Załączniku ZA odpowiedniej normy zharmonizowanej."
          }
        },
        {
          "@type": "Question",
          "name": "Co to jest Cyfrowy Paszport Produktu (DPP) w CPR 2024/3110?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Cyfrowy Paszport Produktu (DPP) to nowe wymaganie wprowadzone przez art. 75–80 CPR 2024/3110. Jest to zbiór cyfrowych danych o wyrobie budowlanym, obejmujący właściwości użytkowe, skład materiałowy, substancje SVHC i informacje środowiskowe. DPP nie zastępuje DoP&C, lecz je uzupełnia. Szczegółowe wymagania dotyczące DPP zostaną określone w aktach delegowanych Komisji Europejskiej po 2026 roku. DPP stanie się obowiązkowy etapami dla poszczególnych kategorii wyrobów, prawdopodobnie po 2027 roku."
          }
        },
        {
          "@type": "Question",
          "name": "Jakie kary grożą za naruszenie CPR 2024/3110?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "CPR 2024/3110 zobowiązuje państwa członkowskie do ustanowienia skutecznych, proporcjonalnych i odstraszających sankcji za naruszenia rozporządzenia (art. 92). W Polsce szczegółowe kary określa ustawa o wyrobach budowlanych. Mogą obejmować: nakaz wycofania wyrobu z rynku, zakaz wprowadzania do obrotu, kary pieniężne, a w skrajnych przypadkach odpowiedzialność karną. Organy nadzoru rynku (GUNB — Główny Urząd Nadzoru Budowlanego) są uprawnione do kontroli zgodności z CPR."
          }
        },
        {
          "@type": "Question",
          "name": "Czy małe firmy (MŚP) mają ułatwienia w CPR 2024/3110?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Tak, CPR 2024/3110 przewiduje uproszczenia dla mikroprzedsiębiorstw i MŚP. Mikroprzedsiębiorstwa (poniżej 10 pracowników, obrót do 2 mln EUR) mogą stosować uproszczone procedury zgodnie z art. 60. Ponadto KE może w aktach delegowanych przewidzieć dodatkowe ułatwienia dla MŚP, w tym uproszczony format dokumentacji cyfrowej. Uproszczenia nie zwalniają jednak z obowiązku wystawiania DoP&C i oznakowania CE."
          }
        }
