<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E293B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FBBF24;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Tło -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Dekoracyjne elementy geometryczne -->
  <circle cx="1050" cy="100" r="180" fill="#F59E0B" opacity="0.05"/>
  <circle cx="1100" cy="550" r="120" fill="#F59E0B" opacity="0.04"/>
  <rect x="0" y="0" width="6" height="630" fill="url(#amber)"/>

  <!-- Logo symbol - kwadrat z N -->
  <rect x="60" y="60" width="80" height="80" rx="12" fill="#F59E0B"/>
  <text x="100" y="122" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="58" text-anchor="middle" fill="#0F172A">N</text>

  <!-- Tytuł portalu -->
  <text x="165" y="100" font-family="Arial, sans-serif" font-weight="700" font-size="42" fill="#F59E0B">NowyCPR</text>
  <text x="165" y="100" font-family="Arial, sans-serif" font-weight="400" font-size="42" fill="#64748B" dx="185">.pl</text>

  <!-- Podtytuł -->
  <text x="165" y="132" font-family="Arial, sans-serif" font-weight="400" font-size="18" fill="#94A3B8">Portal informacyjny CPR 2024/3110</text>

  <!-- Separator -->
  <rect x="60" y="185" width="500" height="2" fill="#F59E0B" opacity="0.3"/>

  <!-- Główny nagłówek -->
  <text x="60" y="260" font-family="Arial, sans-serif" font-weight="700" font-size="52" fill="#F1F5F9">Rozporządzenie CPR</text>
  <text x="60" y="320" font-family="Arial, sans-serif" font-weight="900" font-size="62" fill="#F59E0B">(EU) 2024/3110</text>

  <!-- Opis -->
  <text x="60" y="390" font-family="Arial, sans-serif" font-weight="400" font-size="24" fill="#94A3B8">Wyroby budowlane · Oznakowanie CE · DoP&amp;C</text>
  <text x="60" y="425" font-family="Arial, sans-serif" font-weight="400" font-size="24" fill="#94A3B8">Certyfikacja · AVS · Importerzy</text>

  <!-- Tagi -->
  <rect x="60" y="470" width="160" height="36" rx="18" fill="#F59E0B" opacity="0.15"/>
  <text x="140" y="493" font-family="Arial, sans-serif" font-weight="600" font-size="15" text-anchor="middle" fill="#F59E0B">CPR 2024</text>

  <rect x="232" y="470" width="180" height="36" rx="18" fill="#F59E0B" opacity="0.15"/>
  <text x="322" y="493" font-family="Arial, sans-serif" font-weight="600" font-size="15" text-anchor="middle" fill="#F59E0B">Oznakowanie CE</text>

  <rect x="424" y="470" width="130" height="36" rx="18" fill="#F59E0B" opacity="0.15"/>
  <text x="489" y="493" font-family="Arial, sans-serif" font-weight="600" font-size="15" text-anchor="middle" fill="#F59E0B">DoP&amp;C</text>

  <!-- URL -->
  <text x="60" y="570" font-family="Arial, sans-serif" font-weight="600" font-size="20" fill="#475569">www.nowycpr.pl</text>

  <!-- Multicert badge -->
  <rect x="900" y="530" width="240" height="50" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="1020" y="560" font-family="Arial, sans-serif" font-weight="400" font-size="13" text-anchor="middle" fill="#64748B">Wydawca: Multicert Sp. z o.o.</text>
</svg>